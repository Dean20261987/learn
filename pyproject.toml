[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learn"
version = "0.2.0"
requires-python = ">=3.12"

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"