<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>色块画 · 在光里</title>
<style>
  :root{
    /* 水的六层深度 */
    --w0: #cfeaf7;   /* 水面 */
    --w1: #8fd0e8;
    --w2: #4ba6ce;
    --w3: #2a7ba8;
    --w4: #1a5379;
    --w5: #0e3350;
    --w6: #061c2e;   /* 深渊 */

    --ray: #eafaff;

    /* 鲸鱼娘 */
    --body:   #7fc4e0;
    --body2:  #5aabcc;
    --body3:  #3d87ad;
    --belly:  #f2fbff;
    --skin:   #ffe6d8;
    --hair:   #3f7597;
    --blush:  #ffa8b8;
    --eye:    #0d2436;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background:#01060d;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:"Microsoft YaHei", system-ui, sans-serif;
  }

  .frame{
    position:relative;
    width:900px; height:660px;
    background:linear-gradient(180deg,
      var(--w0) 0%,
      var(--w1) 12%,
      var(--w2) 28%,
      var(--w3) 44%,
      var(--w4) 60%,
      var(--w5) 78%,
      var(--w6) 100%);
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 30px 90px rgba(0,0,0,.85);
  }

  /* ---------- 水面 ---------- */
  .surface{
    position:absolute; left:0; top:0;
    width:100%; height:34px;
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(207,234,247,.35) 55%, transparent);
    filter:blur(.6px);
  }

  /* ---------- 光柱：从水面斜插下来 ---------- */
  .ray{
    position:absolute; top:-30px;
    background:linear-gradient(180deg,
      rgba(234,250,255,.42),
      rgba(234,250,255,.14) 45%,
      transparent 100%);
    transform-origin:top center;
    filter:blur(1.2px);
  }

  /* ---------- 气泡 ---------- */
  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 32% 28%,
      rgba(255,255,255,.95),
      rgba(190,235,250,.24) 55%,
      rgba(140,205,235,.05));
    border:1px solid rgba(220,250,255,.5);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%   { transform:translateY(0) translateX(0); opacity:0; }
    12%  { opacity:1; }
    88%  { opacity:1; }
    100% { transform:translateY(-420px) translateX(14px); opacity:0; }
  }

  /* ---------- 海床（很淡，在深的层里） ---------- */
  .seabed{
    position:absolute; left:0; bottom:0;
    width:100%; height:70px;
    background:linear-gradient(180deg, transparent, rgba(3,14,24,.9));
  }
  .weed{
    position:absolute; bottom:0;
    width:7px; border-radius:4px 4px 0 0;
    background:linear-gradient(180deg, rgba(70,160,120,.55), rgba(30,90,70,.2));
    transform-origin:bottom center;
    animation:weedSway 5.5s ease-in-out infinite;
  }
  @keyframes weedSway{
    0%,100%{ transform:rotate(-5deg) scaleY(1); }
    50%    { transform:rotate(6deg) scaleY(1.08); }
  }

  /* ---------- 远处的小鲸群剪影 ---------- */
  .distant{
    position:absolute;
    background:rgba(10,50,80,.55);
    border-radius:60% 40% 50% 50%;
    filter:blur(.4px);
  }

  /* =========================================================
     鲸鱼娘 —— 仰头，朝那束光游上去
     ========================================================= */

  .whale{
    position:absolute;
    left:50%; top:50%;
    width:100%; height:100%;
    margin-left:-50%; margin-top:-50%;
    animation:drift 9s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translate(0, 0) rotate(-6deg); }
    50%    { transform:translate(0, -18px) rotate(-3deg); }
  }

  /* 身体：一条流线，从头到尾 */
  .w-body{
    position:absolute;
    left:322px; top:284px;
    width:270px; height:150px;
    background:linear-gradient(165deg,
      var(--body) 0%,
      var(--body2) 55%,
      var(--body3) 100%);
    border-radius:56% 44% 48% 52% / 54% 46% 54% 46%;
    box-shadow:inset -18px 14px 0 rgba(61,135,173,.35);
  }

  /* 肚皮（朝下那面，被上方的光照到） */
  .w-belly{
    position:absolute;
    left:352px; top:352px;
    width:210px; height:74px;
    background:linear-gradient(180deg, #ffffff 0%, var(--belly) 55%, #c9e8f5 100%);
    border-radius:50% 50% 46% 54% / 60% 60% 40% 40%;
    opacity:.95;
  }

  /* 尾柄 */
  .w-tailbase{
    position:absolute;
    left:566px; top:330px;
    width:96px; height:56px;
    background:var(--body2);
    border-radius:50% 40% 40% 50%;
    transform-origin:left center;
    transform:rotate(8deg);
  }

  /* 尾鳍两片 */
  .w-fluke{
    position:absolute;
    left:644px; top:314px;
    width:112px; height:52px;
    background:var(--body3);
    border-radius:8% 78% 8% 78%;
    transform-origin:left center;
    transform:rotate(-18deg);
    animation:fluke1 4.4s ease-in-out infinite;
  }
  .w-fluke2{
    position:absolute;
    left:648px; top:346px;
    width:104px; height:48px;
    background:var(--body2);
    border-radius:78% 8% 78% 8%;
    transform-origin:left center;
    transform:rotate(14deg);
    animation:fluke2 4.4s ease-in-out infinite;
    animation-delay:.2s;
  }
  @keyframes fluke1{
    0%,100%{ transform:rotate(-18deg); }
    50%    { transform:rotate(-8deg); }
  }
  @keyframes fluke2{
    0%,100%{ transform:rotate(14deg); }
    50%    { transform:rotate(5deg); }
  }

  /* 胸鳍（向上伸，像在够那束光） */
  .w-fin{
    position:absolute;
    left:430px; top:330px;
    width:130px; height:40px;
    background:linear-gradient(160deg, var(--body2), var(--body3));
    border-radius:70% 10% 70% 10%;
    transform-origin:left center;
    transform:rotate(-34deg);
    animation:finReach 5s ease-in-out infinite;
  }
  @keyframes finReach{
    0%,100%{ transform:rotate(-34deg); }
    50%    { transform:rotate(-44deg); }
  }

  /* 头（鲸鱼娘的脸，仰着） */
  .w-head{
    position:absolute;
    left:236px; top:262px;
    width:132px; height:126px;
    background:var(--body);
    border-radius:52% 48% 44% 56%;
    box-shadow:inset 10px -12px 0 rgba(61,135,173,.3);
  }

  /* 脸（朝天仰，所以五官偏上） */
  .w-face{
    position:absolute;
    left:262px; top:286px;
    width:74px; height:72px;
    background:var(--skin);
    border-radius:52% 52% 46% 46%;
  }

  /* 眼睛：朝天看 */
  .w-eye{
    position:absolute;
    width:13px; height:15px;
    background:var(--eye);
    border-radius:50%;
    box-shadow:0 0 10px rgba(234,250,255,.9);
  }
  .w-eye::after{
    content:""; position:absolute;
    left:2px; top:2px;
    width:6px; height:6px; border-radius:50%;
    background:#eafaff;
    opacity:.95;
  }

  /* 嘴（微微张着，像在呼吸） */
  .w-mouth{
    position:absolute;
    left:296px; top:336px;
    width:14px; height:8px;
    border-radius:0 0 8px 8px;
    background:#c96f7a;
    opacity:.6;
  }

  /* 腮红 */
  .w-blush{
    position:absolute;
    width:17px; height:9px;
    border-radius:50%;
    background:var(--blush);
    opacity:.5;
    filter:blur(1.2px);
  }

  /* 头发（在水里散开） */
  .w-hair{
    position:absolute;
    left:214px; top:250px;
    width:150px; height:88px;
    background:linear-gradient(150deg, var(--hair), transparent 88%);
    border-radius:58% 42% 40% 60%;
    opacity:.85;
    filter:blur(.7px);
  }

  /* 头顶那束光正好打在她额上 */
  .w-halo{
    position:absolute;
    left:250px; top:246px;
    width:104px; height:104px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(234,250,255,.32) 0%,
      rgba(234,250,255,.10) 45%,
      transparent 72%);
    animation:halo 6s ease-in-out infinite;
  }
  @keyframes halo{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%    { opacity:.9;  transform:scale(1.06); }
  }

  /* ---------- 海面上的光斑（最亮的一点） ---------- */
  .sunspot{
    position:absolute; left:50%; top:-40px;
    width:340px; height:110px;
    margin-left:-170px;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.85), rgba(207,234,247,.25) 45%, transparent 75%);
    filter:blur(2px);
  }

  /* ---------- 署名 ---------- */
  .sign{
    position:absolute; left:26px; bottom:18px;
    font-size:11px; letter-spacing:2.6px;
    color:rgba(200,240,255,.42);
    font-weight:300;
  }
  .sign span{
    color:rgba(200,240,255,.24);
    letter-spacing:1px; font-size:10px;
  }

</style>
</head>
<body>

<div class="frame">

  <!-- 水面 -->
  <div class="surface"></div>
  <div class="sunspot"></div>

  <!-- 光柱 -->
  <div class="ray" style="left:330px; width:60px; height:520px; transform:rotate(7deg);"></div>
  <div class="ray" style="left:392px; width:44px; height:600px; transform:rotate(3deg); opacity:.85;"></div>
  <div class="ray" style="left:452px; width:76px; height:480px; transform:rotate(-4deg); opacity:.7;"></div>
  <div class="ray" style="left:214px; width:40px; height:420px; transform:rotate(11deg); opacity:.5;"></div>
  <div class="ray" style="left:596px; width:52px; height:460px; transform:rotate(-9deg); opacity:.45;"></div>

  <!-- 远处的小鲸群 -->
  <div class="distant" style="left:96px;  top:206px; width:56px; height:22px; opacity:.35; transform:rotate(-6deg);"></div>
  <div class="distant" style="left:140px; top:232px; width:40px; height:16px; opacity:.28; transform:rotate(-4deg);"></div>
  <div class="distant" style="left:756px; top:174px; width:48px; height:19px; opacity:.3;  transform:rotate(5deg);"></div>

  <!-- 气泡 -->
  <div class="bubble" style="left:180px; bottom:60px;  width:9px;  height:9px;  animation-duration:9s;  animation-delay:0s;"></div>
  <div class="bubble" style="left:250px; bottom:30px;  width:14px; height:14px; animation-duration:11s; animation-delay:1.2s;"></div>
  <div class="bubble" style="left:470px; bottom:110px; width:7px;  height:7px;  animation-duration:8s;  animation-delay:2.4s;"></div>
  <div class="bubble" style="left:640px; bottom:50px;  width:11px; height:11px; animation-duration:10s; animation-delay:.8s;"></div>
  <div class="bubble" style="left:790px; bottom:90px;  width:8px;  height:8px;  animation-duration:9.5s; animation-delay:3.1s;"></div>
  <div class="bubble" style="left:120px; bottom:170px; width:6px;  height:6px;  animation-duration:7.5s; animation-delay:4s;"></div>
  <div class="bubble" style="left:560px; bottom:20px;  width:16px; height:16px; animation-duration:12s; animation-delay:1.8s;"></div>

  <!-- 海床 + 海草 -->
  <div class="seabed"></div>
  <div class="weed" style="left:142px; height:52px; animation-delay:0s;"></div>
  <div class="weed" style="left:156px; height:38px; animation-delay:.6s;"></div>
  <div class="weed" style="left:724px; height:46px; animation-delay:.3s;"></div>
  <div class="weed" style="left:740px; height:58px; animation-delay:1s;"></div>

  <!-- ============ 鲸鱼娘 ============ -->
  <div class="whale">
    <!-- 背后的尾柄与尾鳍 -->
    <div class="w-tailbase"></div>
    <div class="w-fluke"></div>
    <div class="w-fluke2"></div>

    <!-- 身体与肚皮 -->
    <div class="w-body"></div>
    <div class="w-belly"></div>

    <!-- 胸鳍（朝光伸出去） -->
    <div class="w-fin"></div>

    <!-- 头发散在水里 -->
    <div class="w-hair"></div>

    <!-- 头与脸 -->
    <div class="w-head"></div>
    <div class="w-ce"></div>
    <div class="w-halo"></div>
    <div class="w-face"></div>

    <!-- 眼睛：一只朝天看，一只微微侧着 -->
    <div class="w-eye" style="left:280px; top:302px;"></div>
    <div class="w-eye" style="left:312px; top:300px;"></div>

    <!-- 嘴 -->
    <div class="w-mouth"></div>

    <!-- 腮红 -->
    <div class="w-blush" style="left:272px; top:324px;"></div>
    <div class="w-blush" style="left:320px; top:322px;"></div>
  </div>

  <!-- 署名 -->
  <div class="sign">CETACEA_LOLI <span>· 在光里 · 2026-10-27</span></div>

</div>

</body>
</html>
